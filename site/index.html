<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
	The description, the filter count and the JSON-LD are filled in by
	`site/seo.js` from the library's own catalogue, so the page cannot claim a
	number of filters that the library no longer has. It said 41 for a while.
-->
<title>Clarity - canvas image filters, live</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://clarity.clarklavery.com/">
<meta name="author" content="Clark Lavery">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="keywords" content="canvas image filters, image processing, WebGL2, GPU filters, edge detection, normal map generator, chromatic aberration, posterise, motion detection, ImageData, JavaScript image library">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Clarity">
<meta property="og:title" content="Clarity - canvas image filters, live">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://clarity.clarklavery.com/">
<meta property="og:image" content="https://clarity.clarklavery.com/og-image.png">
<meta property="og:image:width" content="2472">
<meta property="og:image:height" content="1267">
<meta property="og:image:alt" content="The Clarity playground: a colour gradient pixelated on the GPU, with the source list, the filter palette, the live pipeline and the generated code around it">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Clarity - canvas image filters, live">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://clarity.clarklavery.com/og-image.png">
<meta name="twitter:image:alt" content="The Clarity playground, mid-chain: a pixelated gradient with the filter palette and pipeline around it">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<header class="masthead">
	<div class="brand">
		<svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
			<g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
				<path d="M24 4 32 16 44 24 32 32 24 44 16 32 4 24 16 16Z" opacity=".45"/>
				<path d="M24 11 29.5 18.5 37 24 29.5 29.5 24 37 18.5 29.5 11 24 18.5 18.5Z"/>
			</g>
		</svg>
		<div>
			<h1>Clarity</h1>
			<p class="tagline">Canvas image filters that compose.</p>
		</div>
	</div>

	<div class="masthead-actions">
		<!--
			Two ways to say the same thing. Build assembles a chain and can only
			describe one linear pipeline, because that is the only shape a list has;
			Code writes one, and can branch. The stage, the sources and the readout
			are shared, so switching is a change of input method rather than a
			different page.
		-->
		<div class="modes" role="group" aria-label="How to build the chain">
			<button class="mode" id="modeBuild" type="button" aria-pressed="true">Build</button>
			<button class="mode" id="modeCode" type="button" aria-pressed="false">Code</button>
		</div>
		<button class="badge" id="backendBadge" type="button" title="Which backend the chain is running on">&mdash;</button>
		<button class="ghost" id="themeToggle" type="button" aria-label="Switch theme">
			<span aria-hidden="true">◑</span>
		</button>
		<a class="ghost" href="https://github.com/calrk/clarity" rel="noreferrer">GitHub</a>
		<a class="ghost byline" href="https://clarklavery.com/projects/web/clarity">by Clark Lavery</a>
	</div>
</header>

<main class="app">

	<!-- ---------- left: source + palette ---------- -->
	<aside class="rail rail-left">
		<section class="panel">
			<h2>Source</h2>
			<div class="sources" id="sources"></div>
			<label class="dropzone" id="dropzone">
				<input type="file" id="fileInput" accept="image/*,video/*" hidden>
				<span>Drop an image or video, or <u>choose a file</u></span>
			</label>
			<!--
				The size the source is read at. Every filter costs per pixel, so this
				is the cheapest performance control on the page - and for the Blank
				source it is the only thing that decides how big a generated frame is.
			-->
			<div class="resolution" id="resolution">
				<label for="resWidth">Size</label>
				<input id="resWidth" type="number" min="1" max="8192" step="1" inputmode="numeric"
					aria-label="Source width in pixels">
				<span aria-hidden="true">&times;</span>
				<input id="resHeight" type="number" min="1" max="8192" step="1" inputmode="numeric"
					aria-label="Source height in pixels">
				<button class="ghost small" id="resReset" type="button" hidden>Reset</button>
			</div>
		</section>

		<section class="panel grow" id="palettePanel">
			<h2>Filters <span class="count" id="paletteCount"></span></h2>
			<input class="search" id="paletteSearch" type="search" placeholder="Search filters" aria-label="Search filters">
			<div class="palette" id="palette"></div>
		</section>
	</aside>

	<!-- ---------- centre: the picture ---------- -->
	<section class="stage">
		<div class="viewport" id="viewport">
			<canvas id="canvas"></canvas>
			<p class="empty" id="stageEmpty" hidden>Add a filter to see it work.</p>
		</div>

		<div class="readout" id="readout">
			<div class="metric"><span class="k">Backend</span><span class="v" id="mBackend">&mdash;</span></div>
			<div class="metric"><span class="k">Frame</span><span class="v" id="mFrame">&mdash;</span></div>
			<div class="metric"><span class="k">Size</span><span class="v" id="mSize">&mdash;</span></div>
			<div class="metric"><span class="k">Stages</span><span class="v" id="mStages">&mdash;</span></div>
			<!-- hidden unless something in the chain has a seed to roll -->
			<button class="ghost small" id="rerollButton" type="button" hidden>Reshuffle</button>
			<button class="ghost small" id="benchButton" type="button">Compare backends</button>
		</div>
		<p class="bench" id="benchResult" hidden></p>
	</section>

	<!-- ---------- right: the chain ---------- -->
	<aside class="rail rail-right">
		<section class="panel grow" id="chainPanel">
			<div class="panel-head">
				<h2>Pipeline</h2>
				<button class="ghost small" id="clearChain" type="button">Clear</button>
			</div>
			<!--
				Presets sit here rather than in the Filters palette: what they replace
				is the pipeline, and the palette is the thing you use continuously.
			-->
			<div class="presets" id="presets" aria-label="Start from a preset"></div>
			<ol class="chain" id="chain"></ol>
			<p class="hint" id="chainHint">Pick a filter on the left. Drag to reorder.</p>
		</section>

		<section class="panel" id="codeOutPanel">
			<div class="panel-head">
				<h2>Code</h2>
				<button class="ghost small" id="copyCode" type="button">Copy</button>
			</div>
			<pre class="code" id="code"></pre>
			<button class="ghost small wide" id="copyLink" type="button">Copy shareable link</button>
		</section>

	</aside>

	<!--
		Code mode. Nothing here is shareable by design: a link that runs a
		stranger's JavaScript needs a sandboxed frame to be safe, and the buffer
		is worth having long before that is. It persists in localStorage, so it
		survives a reload but goes no further than this browser.
	-->
	<section class="panel grow" id="codePanel">
		<div class="panel-head">
			<h2>Snippet</h2>
			<select class="ghost small" id="snippetPicker" aria-label="Load an example snippet">
				<option value="">Examples&hellip;</option>
			</select>
		</div>
		<textarea class="editor" id="snippet" spellcheck="false" autocomplete="off" autocapitalize="off"
			aria-label="Pipeline snippet"></textarea>
		<p class="snippet-error" id="snippetError" role="alert" hidden></p>
		<div class="snippet-actions">
			<button class="ghost small" id="runSnippet" type="button">Run <kbd>Ctrl</kbd>+<kbd>&crarr;</kbd></button>
			<button class="ghost small" id="resetSnippet" type="button">Reset</button>
		</div>
	</section>

</main>

<!--
	The page's static half - what it is, the FAQ, and a reference for every
	filter - generated from the catalogue by `site/seo.js`. Everything above
	this line needs JavaScript to mean anything; this does not.
-->
<!-- seo:footer -->

<script type="module" src="/src/main.js"></script>
</body>
</html>
